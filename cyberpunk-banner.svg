<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#030509"/>
    <stop offset="0.5" stop-color="#0a0d14"/>
    <stop offset="1" stop-color="#030509"/>
  </linearGradient>
  <linearGradient id="chrome" x1="0" x2="1">
    <stop offset="0" stop-color="#5d6570"/>
    <stop offset="0.25" stop-color="#f4f7fb"/>
    <stop offset="0.5" stop-color="#8d98a6"/>
    <stop offset="0.72" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#59616b"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" x2="1">
    <stop offset="0" stop-color="#00f0ff"/>
    <stop offset="0.5" stop-color="#8b5cf6"/>
    <stop offset="1" stop-color="#ff1744"/>
  </linearGradient>
  <filter id="glowC">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowR">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
    <path d="M38 0H0V38" fill="none" stroke="#18202b" stroke-width="1"/>
  </pattern>
  <pattern id="scan" width="4" height="8" patternUnits="userSpaceOnUse">
    <rect width="4" height="4" fill="#fff" opacity=".025"/>
    <rect y="4" width="4" height="4" fill="#000" opacity=".05"/>
  </pattern>
</defs>

<rect width="1200" height="430" fill="url(#bg)"/>
<rect width="1200" height="430" fill="url(#grid)" opacity=".42"/>
<rect width="1200" height="430" fill="url(#scan)"/>

<!-- neon rails -->
<path d="M42 38H1158" stroke="#00f0ff" stroke-width="2" filter="url(#glowC)"/>
<path d="M42 392H1158" stroke="#ff1744" stroke-width="2" filter="url(#glowR)"/>
<path d="M42 38V392" stroke="#8b5cf6" stroke-width="2"/>
<path d="M1158 38V392" stroke="#00f0ff" stroke-width="2"/>

<!-- moving scan beam -->
<rect x="-280" y="70" width="260" height="2" fill="#00f0ff" opacity=".7">
  <animate attributeName="x" from="-280" to="1220" dur="4.2s" repeatCount="indefinite"/>
</rect>

<!-- glitch bars -->
<g opacity=".7">
  <rect x="70" y="104" width="160" height="4" fill="#ff1744">
    <animate attributeName="x" values="70;112;74;70" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="920" y="116" width="190" height="3" fill="#00f0ff">
    <animate attributeName="x" values="920;860;940;920" dur="1.7s" repeatCount="indefinite"/>
  </rect>
  <rect x="100" y="326" width="120" height="3" fill="#8b5cf6">
    <animate attributeName="width" values="120;190;80;120" dur="1s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- HUD corners -->
<g stroke="#7f8a98" stroke-width="1" fill="none" opacity=".8">
  <path d="M70 78h70M70 78v70M1130 78h-70M1130 78v70M70 350h70M70 350v-70M1130 350h-70M1130 350v-70"/>
</g>

<text x="84" y="98" font-family="monospace" font-size="11" fill="#00f0ff" letter-spacing="3">NEURAL_LINK // 07.77 // ONLINE</text>
<text x="1116" y="98" text-anchor="end" font-family="monospace" font-size="11" fill="#ff1744" letter-spacing="2">SYS://PARTH</text>

<!-- name -->
<g font-family="monospace" font-weight="800" text-anchor="middle">
  <text x="600" y="205" font-size="66" fill="#00f0ff" opacity=".8">
    PARTH MANE
    <animate attributeName="x" values="600;594;603;600" dur="2.1s" repeatCount="indefinite"/>
  </text>
  <text x="604" y="205" font-size="66" fill="#ff1744" opacity=".45">
    PARTH MANE
    <animate attributeName="x" values="604;610;596;604" dur="1.8s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="205" font-size="66" fill="url(#chrome)" stroke="#e6edf3" stroke-width=".35">
    PARTH MANE
  </text>
</g>

<text x="600" y="245" text-anchor="middle" font-family="monospace" font-size="15" fill="#d4dae2" letter-spacing="6">
  BUILD // BREAK // DEBUG // SHIP
</text>

<!-- animated status -->
<g font-family="monospace" font-size="12">
  <text x="90" y="285" fill="#8d98a6">STATUS</text>
  <text x="168" y="285" fill="#00f0ff">[ ONLINE ]</text>
  <text x="330" y="285" fill="#8d98a6">MODE</text>
  <text x="388" y="285" fill="#ff1744">[ BUILDING ]</text>
  <text x="555" y="285" fill="#8d98a6">CORE</text>
  <text x="610" y="285" fill="#8b5cf6">[ AI × BACKEND ]</text>
</g>

<!-- typing line -->
<text x="600" y="320" text-anchor="middle" font-family="monospace" font-size="14" fill="#00f0ff">
  <tspan>ACCESSING_BUILDER_PROFILE...</tspan>
  <animate attributeName="opacity" values="1;.25;1" dur="1.15s" repeatCount="indefinite"/>
</text>

<text x="600" y="366" text-anchor="middle" font-family="monospace" font-size="11" fill="#66717f" letter-spacing="3">
  NO_TUTORIAL_HELL // LEARNING_BY_SHIPPING
</text>

<!-- tiny particles -->
<g fill="#00f0ff">
  <circle cx="205" cy="160" r="2"><animate attributeName="cy" values="160;145;160" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="990" cy="214" r="2"><animate attributeName="cy" values="214;230;214" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="220" cy="300" r="1.5"><animate attributeName="cx" values="220;250;220" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="1000" cy="330" r="1.5"><animate attributeName="cx" values="1000;970;1000" dur="1.9s" repeatCount="indefinite"/></circle>
</g>
</svg>